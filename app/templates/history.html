<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>检测历史 - 工业零部件质量智能检测系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <span class="navbar-brand">🔧 工业零部件质量智能检测系统</span>
    <div>
      <a class="nav-link d-inline text-white" href="/">检测</a>
      <a class="nav-link d-inline text-white" href="/history">历史</a>
      <a class="nav-link d-inline text-white" href="/stats">统计</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <div class="card mb-3">
    <div class="card-header">筛选条件</div>
    <div class="card-body row g-2">
      <div class="col-md-3"><select id="fClass" class="form-select"><option value="">全部分类</option></select></div>
      <div class="col-md-3"><input id="fFrom" type="date" class="form-control"></div>
      <div class="col-md-3"><input id="fTo" type="date" class="form-control"></div>
      <div class="col-md-3"><button id="searchBtn" class="btn btn-primary w-100">查询</button></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">检测记录</div>
    <table class="table table-sm table-hover mb-0">
      <thead><tr><th>时间</th><th>文件</th><th>缺陷类别</th><th>置信度</th><th>模式</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
// 类别下拉框由后端 /api/stats 动态填充（MVTec AD，单一数据源）
const sel = document.getElementById('fClass');
sel.add(new Option('全部分类', ''));
fetch('/api/stats').then(r => r.json()).then(s => {
  (s.classes || []).forEach(c => sel.add(new Option(c, c)));
});

async function load() {
  const p = new URLSearchParams();
  const cls = document.getElementById('fClass').value;
  const f = document.getElementById('fFrom').value;
  const t = document.getElementById('fTo').value;
  if (cls) p.set('class_name', cls);
  if (f) p.set('date_from', f);
  if (t) p.set('date_to', t);
  const res = await fetch('/api/history?' + p);
  const data = await res.json();
  document.getElementById('tbody').innerHTML = data.records.map(r => `<tr>
    <td>${r.detect_time}</td><td>${r.filename}</td>
    <td><span class="badge bg-secondary">${r.class_name || '-'}</span></td>
    <td>${r.confidence ? r.confidence.toFixed(3) : '-'}</td>
    <td>${r.mode || ''}</td></tr>`).join('') || '<tr><td colspan="5" class="text-center">无记录</td></tr>';
}
document.getElementById('searchBtn').addEventListener('click', load);
load();
</script>
</body>
</html>
