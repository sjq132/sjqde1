<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工业零部件质量智能检测系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <span class="navbar-brand">🔧 工业零部件质量智能检测系统</span>
    <div>
      <a class="nav-link d-inline text-white" href="/">检测</a>
      <a class="nav-link d-inline text-white" href="/history">历史</a>
      <a class="nav-link d-inline text-white" href="/stats">统计</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <div class="row">
    <!-- 上传区 -->
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">① 上传零部件图像</div>
        <div class="card-body">
          <input type="file" id="fileInput" accept="image/*" class="form-control">
          <button id="detectBtn" class="btn btn-primary mt-3 w-100">开始检测</button>
          <div id="status" class="mt-2 text-muted small"></div>
        </div>
      </div>
    </div>
    <!-- 结果区 -->
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">② 检测结果</div>
        <div class="card-body text-center">
          <img id="resultImg" class="img-fluid d-none" alt="检测结果">
          <div id="resultText" class="text-muted">检测结果将在此显示</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 明细表 -->
  <div class="row mt-4" id="detailRow" style="display:none;">
    <div class="col-12">
      <div class="card">
        <div class="card-header">③ 缺陷明细</div>
        <table class="table table-sm mb-0">
          <thead><tr><th>#</th><th>类别</th><th>置信度</th><th>位置 (x1,y1,x2,y2)</th></tr></thead>
          <tbody id="detailBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
async function detect() {
  const fileInput = document.getElementById('fileInput');
  const status = document.getElementById('status');
  const btn = document.getElementById('detectBtn');
  if (!fileInput.files.length) { status.textContent = '请先选择图片'; return; }

  const form = new FormData();
  form.append('file', fileInput.files[0]);
  btn.disabled = true; status.textContent = '推理中...';
  try {
    const res = await fetch('/api/detect', { method: 'POST', body: form });
    const data = await res.json();
    if (data.error) { status.textContent = '错误: ' + data.error; return; }

    const img = document.getElementById('resultImg');
    img.src = data.result_image + '?t=' + Date.now();
    img.classList.remove('d-none');

    const rows = data.results.map((r, i) => `<tr>
      <td>${i+1}</td><td><span class="badge bg-danger">${r.class_name}</span></td>
      <td>${r.confidence.toFixed(3)}</td><td>${r.bbox.join(', ')}</td></tr>`).join('');
    document.getElementById('detailBody').innerHTML = rows;
    document.getElementById('detailRow').style.display = 'block';
    status.textContent = `检测完成（模式: ${data.mode}），共 ${data.count} 处缺陷`;
  } catch (e) {
    status.textContent = '请求失败: ' + e;
  } finally { btn.disabled = false; }
}
document.getElementById('detectBtn').addEventListener('click', detect);
</script>
</body>
</html>
