<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统计 - 工业零部件质量智能检测系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <span class="navbar-brand">🔧 工业零部件质量智能检测系统</span>
    <div>
      <a class="nav-link d-inline text-white" href="/">检测</a>
      <a class="nav-link d-inline text-white" href="/history">历史</a>
      <a class="nav-link d-inline text-white" href="/stats">统计</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <div class="row text-center mb-4">
    <div class="col-md-4"><div class="card"><div class="card-body"><h3 id="kpiDefects">-</h3><small>缺陷总数</small></div></div></div>
    <div class="col-md-4"><div class="card"><div class="card-body"><h3 id="kpiImages">-</h3><small>检测图片数</small></div></div></div>
    <div class="col-md-4"><div class="card"><div class="card-body"><h3 id="kpiRate">-</h3><small>缺陷检出率</small></div></div></div>
  </div>
  <div class="card"><div class="card-header">缺陷类型分布</div><div class="card-body"><canvas id="pie"></canvas></div></div>
</div>

<script>
async function load() {
  const data = await (await fetch('/api/stats')).json();
  document.getElementById('kpiDefects').textContent = data.total_defects;
  document.getElementById('kpiImages').textContent = data.total_images;
  const rate = data.total_images ? (data.total_defects / data.total_images * 100).toFixed(1) + '%' : '-';
  document.getElementById('kpiRate').textContent = rate;

  const labels = data.by_class.map(x => x.class_name);
  const values = data.by_class.map(x => x.count);
  new Chart(document.getElementById('pie'), {
    type: 'pie',
    data: { labels, datasets: [{ data: values, backgroundColor: ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6'] }] },
    options: { responsive: true }
  });
}
load();
</script>
</body>
</html>
